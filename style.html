<!DOCTYPE html>
<html>
<head>
<style>
    .ball {
        width: 50px;
        height: 50px;
        background: red;
        border-radius: 50%;
        position: relative;
        animation: bounce 1s infinite alternate;
    }

    @keyframes bounce {
        from {
            top: 0;
        }
        to {
            top: 150px;
        }
    }
</style>
</head>
<body>
    <div class="ball"></div>
</body>
</html>
